services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=4321
      - BEHIND_CLOUDFLARE=true
      - DATABASE_URL=${DATABASE_URL}
      - EMDASH_AUTH_SECRET=${EMDASH_AUTH_SECRET}
    expose:
      - 4321
