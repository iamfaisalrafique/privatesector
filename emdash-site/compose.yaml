services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=4321
      - BEHIND_CLOUDFLARE=true
      - DATABASE_URL=${DATABASE_URL}
      - EMDASH_AUTH_SECRET=${EMDASH_AUTH_SECRET}
    # Ports are managed internally by Coolify via Traefik overlay/bridge network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.privatesector.rule=Host(`privatesector.ch`)"
      - "traefik.http.routers.privatesector.entrypoints=websecure"
      - "traefik.http.routers.privatesector.tls=true"
      - "traefik.http.services.privatesector.loadbalancer.server.port=4321"
